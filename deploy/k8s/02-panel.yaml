# Panel del catalogo (SPA). entrypoint.sh materializa config.js con estas
# variables. VITE_API_BASE_URL es opcional: vacio (misma origen) es el valor correcto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  labels: { app.kubernetes.io/name: panel, app.kubernetes.io/part-of: turicine }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: panel }
  template:
    metadata:
      labels: { app.kubernetes.io/name: panel, app.kubernetes.io/part-of: turicine }
    spec:
      enableServiceLinks: false
      imagePullSecrets: [{ name: ghcr-pull }]
      containers:
        - name: panel
          image: ghcr.io/nfcvec/turicine/panel:latest-__IMAGE_TAG__
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: VITE_API_BASE_URL, valueFrom: { configMapKeyRef: { name: turicine-config, key: VITE_API_BASE_URL, optional: true } } }
            - { name: VITE_IMAGES_BASE_URL, valueFrom: { configMapKeyRef: { name: turicine-config, key: VITE_IMAGES_BASE_URL } } }
            - { name: VITE_KEYCLOAK_URL, valueFrom: { configMapKeyRef: { name: turicine-config, key: VITE_KEYCLOAK_URL } } }
            - { name: VITE_KEYCLOAK_REALM, valueFrom: { configMapKeyRef: { name: turicine-config, key: VITE_KEYCLOAK_REALM } } }
            - { name: VITE_KEYCLOAK_CLIENT_ID, valueFrom: { configMapKeyRef: { name: turicine-config, key: VITE_KEYCLOAK_CLIENT_ID } } }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: panel
  labels: { app.kubernetes.io/name: panel, app.kubernetes.io/part-of: turicine }
spec:
  selector: { app.kubernetes.io/name: panel }
  ports: [{ name: http, port: 8080, targetPort: http }]
