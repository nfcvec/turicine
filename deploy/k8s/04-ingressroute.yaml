# Traduccion de las rutas de Nginx Proxy Manager que servia turicine01: en ambos
# hosts /api y /odata van a catalogo; el resto al SPA de cada host. El trafico
# publico llega por el cloudflared del cluster a websecure; el certificado
# *.turicine.ec lo entrega el TLSStore default.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: turicine
spec:
  entryPoints: [websecure]
  routes:
    - match: (Host(`pruebaspagina.turicine.ec`) || Host(`pruebaspanel.turicine.ec`)) && (PathPrefix(`/api`) || PathPrefix(`/odata`))
      kind: Rule
      priority: 100
      services: [{ name: catalogo, port: 8080 }]
    - match: Host(`pruebaspagina.turicine.ec`)
      kind: Rule
      priority: 1
      services: [{ name: web, port: 8080 }]
    - match: Host(`pruebaspanel.turicine.ec`)
      kind: Rule
      priority: 1
      services: [{ name: panel, port: 8080 }]
  tls: {}
